<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>{{ club.name }} メンバー管理</title>
</head>

<body class="px-12">
    <a href="/admin/members" class="py-3 block">← サークル選択へ戻る</a>

    <header class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-bold">{{ club.name }} メンバー管理</h1>
    </header>

    <hr>
    <h2 class="text-3xl my-4">メンバー追加</h2>
    <input id="student_id" placeholder="学籍番号" class="border border-black rounded-md px-3 py-2 mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <input id="name" placeholder="名前" class="border border-black rounded-md px-3 py-2 mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <button onclick="addMember()" class="inline-block px-4 py-1.5 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">追加</button>
    <hr>

    <h2 class="text-3xl my-4">メンバー一覧</h2>
    <div class="border border-gray-300 rounded-xl">
    <table class="w-full text-left border-collapse">
        <thead class="sticky top-0 bg-gray-100">
            <tr>
                <th class="px-4 py-3 border-b border-gray-300">ID</th>
                <th class="px-4 py-3 border-b border-gray-300">学籍番号</th>
                <th class="px-4 py-3 border-b border-gray-300">名前</th>
                <th class="px-4 py-3 border-b border-gray-300 text-center">操作</th>
            </tr>
        </thead>
        <tbody>
            {% for member in members %}

            <tr class="hover:bg-gray-50">

                <td class="px-4 py-3 border-b border-gray-200">{{ member.id }}</td>

                <td class="px-4 py-3 border-b border-gray-200">
                <input id="student-{{member.id}}" value="{{member.student_id}}">
                </td>

                <td class="px-4 py-3 border-b border-gray-200">
                <input id="name-{{member.id}}" value="{{member.name}}">
                </td>

                <td>
                    <div class="text-center">
                        <button onclick="updateMember({{member.id}})" class="inline-block px-4 py-1.5 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">更新</button>
                        <button onclick="deleteMember({{member.id}})" class="inline-block px-4 py-1.5 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">削除</button>
                    </div>
                
                </td>
            </tr>

            {% endfor %}
        </tbody>
    </table>
</div>

<script>

const clubId = {{ club.id }};


// メンバー追加
async function addMember(){

    const data={
        student_id:document.getElementById("student_id").value,
        name:document.getElementById("name").value,
        club_id:clubId
    };


    await fetch("/api/admin/members",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });


    location.reload();

}



// メンバー更新
async function updateMember(id){

    const data={
        student_id:
        document.getElementById(`student-${id}`).value,

        name:
        document.getElementById(`name-${id}`).value
    };


    await fetch(`/api/admin/members/${id}`,{
        method:"PATCH",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });


    location.reload();

}



// メンバー削除
async function deleteMember(id){

    if(!confirm("削除しますか？")){
        return;
    }


    await fetch(`/api/admin/members/${id}`,{
        method:"DELETE"
    });


    location.reload();

}


</script>


</body>
</html>
