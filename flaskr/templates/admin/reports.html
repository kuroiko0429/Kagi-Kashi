<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<title>活動報告管理</title>
</head>

<body class="px-12">

<a href="/admin" class="py-3 block">← 管理者メニューへ戻る</a>
<header class="flex justify-between items-center mb-8">
    <h1 class="text-4xl font-bold text-gray-800">活動報告管理</h1>
</header>

<hr>

<h2 class="text-3xl my-4">活動報告一覧</h2>
<div class="border border-gray-300 rounded-xl">
    <table class="w-full text-left border-collapse table-fixed">
        <thead class="sticky top-0 bg-gray-100">
            <tr>
                <th class="px-4 py-3 border-b border-gray-300 w-12">ID</th>
                <th class="px-4 py-3 border-b border-gray-300 w-70">サークル</th>
                <th class="px-4 py-3 border-b border-gray-300 w-24">報告者</th>
                <th class="px-4 py-3 border-b border-gray-300 w-24">学生ID</th>
                <th class="px-4 py-3 border-b border-gray-300 w-34">活動日</th>
                <th class="px-4 py-3 border-b border-gray-300">活動内容</th>
                <th class="px-4 py-3 border-b border-gray-300">操作</th>
            </tr>
        </thead>
        <tbody>
            {% for report in reports %}

            <tr class="hover:bg-gray-50">

            <td class="px-4 py-3 border-b border-gray-200">{{ report.id }}</td>

            <td class="px-4 py-3 border-b border-gray-200 whitespace-nowrap">{{ report.club_name }}</td>

            <td class="px-4 py-3 border-b border-gray-200">
            <input id="reporter-{{ report.id }}" value="{{ report.reporter_name }}">
            </td>

            <td class="px-4 py-3 border-b border-gray-200">
            <input id="student-{{ report.id }}" value="{{ report.student_id }}">
            </td>

            <td class="px-4 py-3 border-b border-gray-200">
            <input type="date" id="date-{{ report.id }}" value="{{ report.report_date }}">
            </td>

            <td class="px-4 py-3 border-b border-gray-200">
            <textarea id="desc-{{ report.id }}" rows="4" class="w-full border border-gray-300 rounded-md px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y">{{ report.description }}</textarea>
            </td>

            <td class="px-4 py-3 border-b border-gray-200 whitespace-nowrap">
            <button onclick="updateReport({{ report.id }})" class="inline-block px-4 py-1.5 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">更新</button>
            <button onclick="deleteReport({{ report.id }})" class="inline-block px-4 py-1.5 bg-red-600 text-white text-sm rounded-lg hover:bg-red-700">削除</button>
            </td>

            </tr>

            {% endfor %}
        </tbody>
    </table>
</div>




</table>

<script>

async function updateReport(id){

    const data={
        reporter_name:document.getElementById(`reporter-${id}`).value,
        student_id:document.getElementById(`student-${id}`).value,
        report_date:document.getElementById(`date-${id}`).value,
        description:document.getElementById(`desc-${id}`).value
    };

    await fetch(`/api/admin/activity-reports/${id}`,{
        method:"PATCH",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    location.reload();

}

async function deleteReport(id){

    if(!confirm("この活動報告を削除しますか？")){
        return;
    }

    await fetch(`/api/admin/activity-reports/${id}`,{
        method:"DELETE"
    });

    location.reload();

}

</script>

</body>
</html>
