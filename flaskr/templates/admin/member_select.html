<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>メンバー管理</title>
</head>

<body class="px-12">
    <a href="/admin" class="py-3 block">← 管理者メニューへ戻る</a>

    <header class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-bold text-gray-800">メンバー管理</h1>
    </header>
<hr>

<h2 class="text-3xl my-4">管理するサークルを選択</h2>

<div class="max-h-83 overflow-y-auto border border-gray-300 rounded-xl">
    <table class="w-full text-left border-collapse">
        <thead class="sticky top-0 bg-gray-100">
            <tr>
                <th class="px-4 py-3 border-b border-gray-300">ID</th>
                <th class="px-4 py-3 border-b border-gray-300">サークル名</th>
                <th class="px-4 py-3 border-b border-gray-300">部屋番号</th>
                <th class="px-4 py-3 border-b border-gray-300">操作</th>
            </tr>
        </thead>
        <tbody>
            {% for club in clubs %}
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 border-b border-gray-200">{{ club.id }}</td>
                <td class="px-4 py-3 border-b border-gray-200">{{ club.name }}</td>
                <td class="px-4 py-3 border-b border-gray-200">{{ club.room_number }}</td>
                <td class="px-4 py-3 border-b border-gray-200">
                    <a href="/admin/members/{{ club.id }}" class="inline-block px-4 py-1.5 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">
                        メンバー管理
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
