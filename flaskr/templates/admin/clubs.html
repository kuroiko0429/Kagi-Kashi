<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>サークル管理</title>
</head>


<body>

<h1>サークル管理</h1>


<a href="/admin">
    ← 管理者メニューへ戻る
</a>


<hr>


<h2>サークル追加</h2>


<div>

    <input id="name" placeholder="サークル名">

    <input id="room_number" placeholder="部屋番号">

    <input id="leader_student_id" placeholder="部長ID">

    <input id="icon_color" placeholder="アイコン色">

    <select id="category">
        <option value="sports">体育系</option>
        <option value="cultural">文化系</option>
        <option value="association">同好会</option>
    </select>


    <button onclick="addClub()">
        追加
    </button>

</div>


<hr>


<h2>サークル一覧</h2>


<table border="1">

<thead>

<tr>
    <th>ID</th>
    <th>名前</th>
    <th>部屋番号</th>
    <th>部長ID</th>
    <th>状態</th>
    <th>カテゴリー</th>
    <th>操作</th>
</tr>

</thead>


<tbody id="club-list">

</tbody>


</table>



<script>


// ===============================
// サークル一覧取得
// ===============================
async function loadClubs(){
    const response = await fetch("/api/admin/clubs");

    const clubs = await response.json();

    const table = document.getElementById("club-list");

    table.innerHTML = "";

    clubs.forEach(club => {
        const row = document.createElement("tr");

        row.innerHTML = `

            <td>${club.id}</td>

            <td>
                <input id="name-${club.id}" value="${club.name}">
            </td>

            <td>
                <input id="room-${club.id}" value="${club.room_number}">
            </td>

            <td>
                <input id="leader-${club.id}" 
                       value="${club.leader_student_id ?? ""}">
            </td>


            <td>

                <select id="status-${club.id}">

                    <option value="locked"
                    ${club.status=="locked"?"selected":""}>
                    locked
                    </option>


                    <option value="active"
                    ${club.status=="active"?"selected":""}>
                    active
                    </option>


                    <option value="temp_locked"
                    ${club.status=="temp_locked"?"selected":""}>
                    temp_locked
                    </option>

                </select>

            </td>


            <td>

                <select id="category-${club.id}">

                    <option value="sports"
                    ${club.category=="sports"?"selected":""}>
                    体育系
                    </option>


                    <option value="cultural"
                    ${club.category=="cultural"?"selected":""}>
                    文化系
                    </option>


                    <option value="association"
                    ${club.category=="association"?"selected":""}>
                    同好会
                    </option>

                </select>

            </td>


            <td>

                <button onclick="updateClub(${club.id})">
                    更新
                </button>


                <button onclick="deleteClub(${club.id})">
                    削除
                </button>

            </td>

        `;

        table.appendChild(row);
    });
}

// ===============================
// サークル追加
// ===============================
async function addClub(){
    const data = {
        name:
        document.getElementById("name").value,
        room_number:
        document.getElementById("room_number").value,
        leader_student_id:
        document.getElementById("leader_student_id").value,
        icon_color:
        document.getElementById("icon_color").value,
        category:
        document.getElementById("category").value
    };

    await fetch("/api/admin/clubs",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    loadClubs();
}

// ===============================
// サークル更新
// ===============================
async function updateClub(id){
    const data = {
        name:
        document.getElementById(`name-${id}`).value,
        room_number:
        document.getElementById(`room-${id}`).value,
        status:
        document.getElementById(`status-${id}`).value,
        message:"",
        icon_color:"#000000",
        category:
        document.getElementById(`category-${id}`).value
    };

    await fetch(`/api/admin/clubs/${id}`,{
        method:"PATCH",
        headers:{
            "Content-Type":"application/json"
        },
        body:
        JSON.stringify(data)
    });

    loadClubs();
}

// ===============================
// サークル削除
// ===============================
async function deleteClub(id){
    if(!confirm("削除しますか？")){
        return;
    }

    await fetch(`/api/admin/clubs/${id}`,{
        method:"DELETE"
    });

    loadClubs();
}

// 初期読み込み
loadClubs();

</script>

</body>

</html>
