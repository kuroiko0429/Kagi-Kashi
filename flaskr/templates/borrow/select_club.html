      {% for club in clubs %}

        <button

          class="club-button w-full h-14 px-5 rounded-xl border-2 border-gray-200 bg-gray-50 hover:bg-green-50 hover:border-green-500 text-left font-medium text-gray-700 transition-all"
          data-club-id="{{ club.id }}"
          data-club-name="{{ club.name }}"
        >
          {{ club.name }}
        </button>

      {% endfor %}

    </div>

    {% if not clubs %}
      <p class="text-center text-gray-400 py-8">
        選択できるサークルがありません。
      </p>
    {% endif %}

  </div>

  <div class="flex justify-end p-5 border-t border-gray-200 bg-gray-50">

    <button
      type="button"
      id="cancel-button"
      class="px-5 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-200 transition-colors"
    >
      戻る
    </button>

  </main>

  <footer class="w-full text-center py-3 bg-gray-50 border-t border-gray-200 text-xs text-gray-500">
    &copy; 2026
  </footer>

  <script>

    const clubButtons = document.querySelectorAll(".club-button");

    clubButtons.forEach(button => {

      button.addEventListener("click", async function() {

        const clubId = this.dataset.clubId;

        // サークルを選択
        const response = await fetch("/borrow/select_common_club", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            club_id: clubId
          })
        });

        if (!response.ok) {
          alert("サークルの選択に失敗しました。");
          return;
        }

        // サークル選択後、学生証入力画面へ
        window.location.href = "/borrow/input";

      });

    });


    // 戻るボタン
    document.getElementById("cancel-button").addEventListener("click", function() {

      window.location.href = "/borrow";

    });

  </script>

</body>
</html>
